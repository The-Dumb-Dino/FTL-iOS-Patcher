# The browser patcher on GitHub Pages: builds web/ftl-core.{js,wasm} from the desktop
# patcher's core and publishes web/. The release files it loads (files/) are committed.
name: Web patcher

on:
  push:
    branches: [master]
    paths: ["web/**", "patcher/src/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v14
        with:
          version: 7.0.0
      - name: Build the WASM core
        run: ./web/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
